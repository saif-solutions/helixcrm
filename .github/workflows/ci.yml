name: CI Pipeline - 4 Layer Testing

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # Job 1: Quality Gates (Fast Feedback)
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/api/package-lock.json

      - name: Install Dependencies
        run: |
          cd apps/api
          npm ci

      - name: Type Check
        run: |
          cd apps/api
          npx tsc --noEmit

      - name: Lint
        run: |
          cd apps/api
          npm run lint 2>/dev/null || echo "No lint script found, skipping"

      - name: Unit Tests (Layer 1)
        run: |
          cd apps/api
          npm run test:unit -- --coverage

  # Job 2: Integration Tests (Layer 2)
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: quality-gates

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/api/package-lock.json

      - name: Install Dependencies
        run: |
          cd apps/api
          npm ci

      - name: Setup Database
        env:
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/testdb
        run: |
          cd apps/api
          npx prisma generate
          npx prisma db push --accept-data-loss
          # Run any seed scripts if needed

      - name: Run Integration Tests
        env:
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/testdb
          NODE_ENV: test
        run: |
          cd apps/api
          npm run test:integration

  # Job 3: Contract Tests (Layer 3)
  contract-tests:
    name: Contract Tests
    runs-on: ubuntu-latest
    needs: quality-gates

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          cd apps/api
          npm ci

      - name: Run Contract Tests
        run: |
          cd apps/api
          npm run test:contracts

  # Job 4: Security Tests (Layer 4)
  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    needs: quality-gates

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          cd apps/api
          npm ci

      - name: Run Security Tests
        run: |
          cd apps/api
          npm run test:security

  # Job 5: Full Release Gate (All layers)
  release-gate:
    name: Release Gate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality-gates, integration-tests, contract-tests, security-tests]

    steps:
      - name: All Tests Passed
        run: |
          echo "✅ All 4 test layers passed"
          echo "Ready for production deployment"
